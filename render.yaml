# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION — ZEXO LICENSE SERVER & DATABASE
# ==============================================================================
# This Blueprint guarantees deployment stability, persistent environment variables,
# and permanent PostgreSQL database storage across all future updates.
# ==============================================================================
services:
  - type: web
    name: zexo-license-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: MADARA-FF
      # Protected secrets: 'sync: false' guarantees Render Dashboard values are
      # preserved permanently and NEVER overwritten or deleted by code updates.
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: APP_LATEST_VERSION
        value: 1.4.1
      - key: APP_VERSION_CODE
        value: 43
      - key: APP_MIN_VERSION
        value: 1.0.0
      - key: APP_DOWNLOAD_URL
        value: https://github.com/ABHISHEK14677/license-server/releases/download/v1.4.1/RootOptimizer.apk
      # Connect persistent PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: zexo-db
          property: connectionString

# Managed PostgreSQL Database: eliminates ephemeral SQLite data loss on restarts
databases:
  - name: zexo-db
    plan: free
    region: oregon
    databaseName: zexo_licenses
    user: zexo_admin
